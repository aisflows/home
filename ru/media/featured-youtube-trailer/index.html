    <script>
      (() => {
        document.querySelectorAll("[data-media-poster]").forEach((image) => {
          const showPosterFallback = () => {
            image.hidden = true;
            const fallback = image.nextElementSibling;
            if (fallback) fallback.hidden = false;
          };
          image.addEventListener("error", showPosterFallback);
          if (image.complete && image.naturalWidth === 0) showPosterFallback();
        });
        const video = document.querySelector("[data-media-video]");
        const fallback = document.querySelector("[data-media-playback-fallback]");
        const showFailure = () => {
          if (fallback) fallback.hidden = false;
          if (video && fallback) video.setAttribute("aria-describedby", fallback.id);
        };
        video?.addEventListener("error", showFailure);
        video?.querySelector("source")?.addEventListener("error", showFailure);
      })();
    </script>
